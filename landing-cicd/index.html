<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Page CI/CD</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #2563eb; color: #fff; text-align: center; padding: 60px 20px; }
    main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #e5e7eb; }
    .success { color: green; font-weight: bold; }
    .failure { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Selamat Datang</h1>
    <p>Landing page ini di-deploy otomatis dengan CI/CD GitHub Actions</p>
  </header>
  <main>
    <h2>Riwayat CI/CD</h2>
    <table>
      <thead>
        <tr><th>#</th><th>Commit</th><th>Status</th><th>Waktu</th></tr>
      </thead>
      <tbody id="riwayat"><tr><td colspan="4">Memuat...</td></tr></tbody>
    </table>
  </main>
  <script>
 fetch("https://api.github.com/repos/rahmaaulia290107-netizen/Tugas-9_landing-cicd/actions/runs?per_page=10")
      .then(r => r.json())
      .then(data => {
        const tbody = document.getElementById("riwayat");
        tbody.innerHTML = "";
        data.workflow_runs.forEach(run => {
          const status = run.conclusion || run.status;
          const cls = status === "success" ? "success" : (status === "failure" ? "failure" : "");
          tbody.innerHTML += `<tr>
            <td>${run.run_number}</td>
            <td>${run.head_commit.message}</td>
            <td class="${cls}">${status}</td>
            <td>${new Date(run.created_at).toLocaleString("id-ID")}</td>
          </tr>`;
        });
      })
      .catch(() => {
        document.getElementById("riwayat").innerHTML =
          "<tr><td colspan='4'>Gagal memuat riwayat</td></tr>";
      });
  </script>
</body>
</html>
